spring.application.name=travel-memories

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/travel_memories?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=change_this_to_a_long_random_string_before_deploying
app.jwt.expiration-ms=86400000

# Cloudinary (for image uploads — see MemoryPhoto entity)
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

server.port=8080
